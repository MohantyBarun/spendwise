plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.spendwise.app'
    compileSdk 37

    defaultConfig {
        applicationId 'com.spendwise.app'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.1'
    }

    buildFeatures {
        buildConfig = true
    }

    // full: your own phone, captures payments from bank SMS automatically (needs SMS permission,
    //       which Play Protect blocks for apps installed from a file).
    // demo: installs anywhere. No SMS permission; payments come from sharing an SMS into the app,
    //       manual entry, or built-in sample data.
    flavorDimensions = ['edition']
    productFlavors {
        full {
            dimension 'edition'
            buildConfigField 'boolean', 'SMS_CAPTURE', 'true'
        }
        demo {
            dimension 'edition'
            versionNameSuffix '-demo'
            buildConfigField 'boolean', 'SMS_CAPTURE', 'false'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'androidx.biometric:biometric:1.1.0'

    implementation platform('com.google.firebase:firebase-bom:35.2.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'

    testImplementation 'junit:junit:4.13.2'
}
