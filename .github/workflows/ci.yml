name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  android:
    name: Android build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # The real Firebase config is not committed; a placeholder is enough to compile and test.
      - name: Use placeholder Firebase config
        run: cp ci/google-services.placeholder.json app/google-services.json
      - name: Unit tests (both editions) and compile both APKs
        run: ./gradlew --no-daemon testFullDebugUnitTest testDemoDebugUnitTest assembleFullDebug assembleDemoDebug

  web:
    name: Web demo tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
